services:
  - type: web
    name: gallery-noir-backend
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    buildCommand: npm ci --omit=dev
    startCommand: npm run db:check && npm start
    healthCheckPath: /api/health/ready
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: DB_SSL
        value: "true"
      - key: DB_SSL_REJECT_UNAUTHORIZED
        value: "true"
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGINS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: JWT_ISSUER
        value: gallery-noir-api
      - key: JWT_AUDIENCE
        value: gallery-noir-web
      - key: DB_CONNECTION_LIMIT
        value: "5"
      - key: DB_CONNECTION_TIMEOUT_MS
        value: "10000"
      - key: DB_IDLE_TIMEOUT_MS
        value: "30000"
      - key: BCRYPT_ROUNDS
        value: "12"
